name: Codeowners merging
on:
  pull_request_target: { types: [opened] }
  issue_comment: { types: [created] }

jobs:
  announce:
    if: >-
      github.repository == 'microsoft/TypeScript-DOM-lib-generator' &&
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = await import("node:url");
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/codeowners-merge.mjs`,
            );
            const { announcePullRequest } = await import(moduleUrl);
            await announcePullRequest({ github, context });

  check-merge-command:
    if: >-
      github.repository == 'microsoft/TypeScript-DOM-lib-generator' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'lgtm')
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      valid: ${{ steps.check.outputs.valid }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - name: Check merge command
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node .github/scripts/codeowners-merge.mjs classify

  merge:
    needs: check-merge-command
    if: >-
      github.repository == 'microsoft/TypeScript-DOM-lib-generator' &&
      needs.check-merge-command.outputs.valid == 'true'
    runs-on: ubuntu-slim
    environment:
      name: azure
      deployment: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create GitHub App token
        id: app-token
        uses: microsoft/create-github-app-token-via-key-vault@5ba0d436e9c3cac52feff4d1f2f66f9698ce4a2d # v1
        with:
          client-id: ${{ vars.TYPESCRIPT_AUTOMATION_GITHUB_APP_CLIENT_ID }}
          key-id: ${{ vars.TYPESCRIPT_AUTOMATION_GITHUB_APP_KEY_ID }}
          owner: microsoft
          repositories: TypeScript-DOM-lib-generator
          permission-contents: write
          permission-checks: read
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { pathToFileURL } = await import("node:url");
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/codeowners-merge.mjs`,
            );
            const { mergePullRequest } = await import(moduleUrl);
            await mergePullRequest({ github, context });
